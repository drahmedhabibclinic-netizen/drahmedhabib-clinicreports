<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dr. Ahmed Habib Clinic Reports</title>
<meta name="theme-color" content="#1f6fb2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clinic Reports">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: form on the right (RTL), live sheet preview on the left; stacks on phones. */
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --fg: #16212c;
  --muted: #566879;
  --line: #d4dde6;
  --accent: #1f6fb2;
  --accent-fg: #ffffff;
  --warn: #a4380f;
  --ok: #17692c;
  --paper-shadow: 0 1px 2px rgba(22, 33, 44, .12), 0 8px 24px rgba(22, 33, 44, .10);
  --ui: "Tajawal", Tahoma, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --card: #16212c; --fg: #e6edf3; --muted: #9aabba; --line: #2a3948;
    --accent: #5aa7e6; --accent-fg: #0b1a28; --warn: #ff9d78; --ok: #6fcf8a;
    --paper-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1620; --card: #16212c; --fg: #e6edf3; --muted: #9aabba; --line: #2a3948;
  --accent: #5aa7e6; --accent-fg: #0b1a28; --warn: #ff9d78; --ok: #6fcf8a;
  --paper-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  font-size: 16px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
.grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 500; font-size: 15px; }
.field input, .field textarea {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%;
  box-sizing: border-box; text-align: right;
}
.field textarea { min-height: 170px; resize: vertical; line-height: 1.7; }
.field input:focus-visible, .field textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.num { direction: ltr; text-align: right; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
button {
  font: inherit; font-weight: 700; border-radius: 6px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1 1 auto; }
button:disabled { opacity: .55; cursor: not-allowed; }
.msg { min-height: 1.6em; margin: 12px 0 0; font-size: 15px; line-height: 1.6; }
.msg.warn { color: var(--warn); }
.msg.ok { color: var(--ok); }
.sheet-wrap { background: var(--bg); }
.sheet { display: block; width: 100%; height: auto; background: #fff; box-shadow: var(--paper-shadow); border-radius: 2px; }
.cap { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
#printArea { display: none; }
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  .app { display: none !important; }
  #printArea { display: block !important; }
  #printArea img { display: block; width: 210mm; height: 297mm; }
}

.header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.header .titles { flex: 0 1 auto; min-width: 0; display: grid; width: max-content; max-width: 100%; }
/* The sentence takes the title's width and wraps under it, so both share the same edges. */
.header .titles .sub { width: 0; min-width: 100%; line-height: 1.5; }
.header .titles h1 { margin: 0 0 4px; }
.header .titles .sub { margin: 0; }
.logo-badge {
  flex: 0 0 auto;
  width: clamp(64px, 16vw, 120px);
  height: auto;
  display: block;
  padding: 10px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.4);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 8px 28px rgba(22, 33, 44, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-badge {
    background: rgba(22, 33, 44, 0.4);
    border-color: rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
}
:root[data-theme="dark"] .logo-badge {
  background: rgba(22, 33, 44, 0.4);
  border-color: rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
</style>

function fontPx(px) { return 'bold ' + px + 'px ' + FONT_STACK; }

function drawRtl(text, xRight, yTop, px) {
  ctx.font = fontPx(px);
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, xRight, yTop + ASCENT * px);
}
function drawLtr(text, xRight, yTop, px) {
  ctx.font = fontPx(px);
  ctx.direction = 'ltr';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, xRight, yTop + ASCENT * px);
}
function widthRtl(text, px) {
  ctx.font = fontPx(px);
  ctx.direction = 'rtl';
  return ctx.measureText(text).width;
}
function wrap(text, px, maxW) {
  const lines = [];
  let cur = '';
  for (const w of text.split(' ')) {
    const trial = cur ? cur + ' ' + w : w;
    if (!cur || widthRtl(trial, px) <= maxW) cur = trial;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function values() {
  return {
    no: $('fileNo').value.trim(),
    name: $('pname').value.split(/\s+/).filter(Boolean).join(' ').replace('/ ', '/'),
    date: $('pdate').value.trim().replace(/-/g, '/'),
    body: $('body').value.split(/\s+/).filter(Boolean).join(' '),
    recip: (() => {
      const r = $('recip').value.split(/\s+/).filter(Boolean).join(' ');
      const rest = r.replace(/^السادة\s*\/\s*/, '').trim();
      if (!rest) return '';
      return /^السادة\s*\//.test(r) ? 'السادة/ ' + rest : r;
    })(),
  };
}

// File name: patient name + file number, e.g. "محمد علي - 273764".
function fileBase(v) {
  const clean = (t) => t.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  const name = clean(v.name.replace(/^[^\s\/]{1,8}\/\s*/, ''));
  return [name, clean(v.no)].filter(Boolean).join(' - ');
}

// Draws the sheet. Returns {fits, size, lines}.
// Draws onto `target`. print=true leaves out the letterhead design and the three field labels,
// keeping the typed data where it sits on the full sheet.
function drawSheet(target, print) {
  if (!letterhead) return { fits: true, size: BODY_START, lines: 0 };
  const v = values();
  target.width = letterhead.naturalWidth;
  target.height = letterhead.naturalHeight;
  ctx = target.getContext('2d');
  if (print) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, target.width, target.height);
    ctx.drawImage(printLayer, 0, 0, target.width, target.height);
  } else {
    ctx.drawImage(letterhead, 0, 0);
  }
  ctx.fillStyle = '#000';

  const hp = S(HEAD_SIZE);
  if (!print) drawRtl('الاسم:', S(RIGHT_EDGE), S(NAME_Y), hp);
  if (v.name) drawRtl(v.name, S(RIGHT_EDGE) - widthRtl('الاسم:', hp) - S(4), S(NAME_Y), hp);
  if (!print) drawRtl('التاريخ:', S(RIGHT_EDGE), S(DATE_Y), hp);
  if (v.date) drawLtr(v.date, S(RIGHT_EDGE) - widthRtl('التاريخ:', hp) - S(4), S(DATE_Y), hp);
  if (v.no) drawLtr(v.no, S(FILE_NO_RIGHT), S(FILE_NO_Y), hp);

  let bodyTop = BODY_TOP;
  if (v.recip) {
    const xr = S(RIGHT_EDGE + 30), yt = S(RECIP_Y), maxW = S(RIGHT_EDGE + 30 - LEFT_EDGE);
    let rs = RECIP_SIZE;
    while (rs > BODY_MIN && widthRtl(v.recip, S(rs)) > maxW) rs -= 1;
    const rp = S(rs);
    drawRtl(v.recip, xr, yt, rp);
    const w = Math.min(widthRtl(v.recip, rp), maxW);
    ctx.fillRect(xr - w, yt + Math.round(rp * 1.02), w, Math.max(3, Math.round(rp * 0.07)));
    bodyTop = RECIP_Y + Math.ceil(RECIP_SIZE * 1.75);
  }

  let size = BODY_START, lines = [], fits = true;
  if (v.body) {
    const maxW = S(RIGHT_EDGE + 30 - LEFT_EDGE);
    const room = S(BODY_BOTTOM - bodyTop);
    for (;;) {
      const px = S(size);
      lines = wrap(v.body, px, maxW);
      if (lines.length * px * 1.75 <= room) break;
      size -= 1;
      if (size < BODY_MIN) { fits = false; size = BODY_MIN; break; }
    }
    const px = S(size), lineH = Math.trunc(px * 1.75);
    let y = S(bodyTop);
    for (const ln of lines) { drawRtl(ln, S(RIGHT_EDGE + 30), y, px); y += lineH; }
  }
  ctx = canvas.getContext('2d');
  return { fits, size, lines: lines.length };
}
function render() { return drawSheet(canvas, false); }

function setMsg(text, kind) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = 'msg' + (kind ? ' ' + kind : '');
}

let timer = null;
function refresh() {
  const r = render();
  if (!r.fits) setMsg('النص طويل جداً ومش هيدخل في المساحة المخصصة على الورقة.', 'warn');
  else if ($('msg').classList.contains('warn')) setMsg('');
  $('cap').textContent = r.lines ? ('النص ' + r.lines + (r.lines === 1 ? ' سطر' : ' سطور') + ' بحجم خط ' + r.size) : '';
}
function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 60); }

// --- Minimal single-page A4 PDF around a JPEG of the sheet ---
async function buildPdf(c = canvas) {
  const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.92));
  const jpg = new Uint8Array(await blob.arrayBuffer());
  const W = c.width, H = c.height;
  const enc = new TextEncoder();
  const chunks = [], offsets = [];
  let pos = 0;
  const push = (u8) => { chunks.push(u8); pos += u8.length; };
  const text = (s) => push(enc.encode(s));
  const obj = (n, s) => { offsets[n] = pos; text(n + ' 0 obj\n' + s + '\nendobj\n'); };

  text('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const content = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(4, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
  offsets[5] = pos;
  text('5 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + W + ' /Height ' + H +
       ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
  push(jpg);
  text('\nendstream\nendobj\n');
  const xref = pos;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  x += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
  text(x);
  return new Blob(chunks, { type: 'application/pdf' });
}

async function save() {
  const v = values();
  const missing = [];
  if (!v.no) missing.push('رقم الملف');
  if (!v.name) missing.push('الاسم');
  if (!v.date) missing.push('التاريخ');
  if (!v.body) missing.push('نص التقرير');
  if (missing.length) { setMsg('ناقص: ' + missing.join('، ') + '.', 'warn'); return; }
  const safeNo = v.no.replace(/[^\p{L}\p{N}_-]/gu, '');
  if (!safeNo) { setMsg('رقم الملف غير صالح.', 'warn'); return; }
  const r = render();
  if (!r.fits) { setMsg('النص طويل جداً ومش هيدخل في المساحة المخصصة على الورقة.', 'warn'); return; }
  $('saveBtn').disabled = true;
  try {
    const pdf = await buildPdf();
    const downloads = await downloadsP;
    if (downloads) {
      await downloads.save({ filename: (fileBase(v) || safeNo) + '.pdf', data: pdf });
    } else {
      // Opened as an ordinary web page: a normal browser download.
      const url = URL.createObjectURL(pdf);
      const a = document.createElement('a');
      a.href = url; a.download = (fileBase(v) || safeNo) + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    setMsg((fileBase(v) || safeNo) + '.pdf is ready. You’ll find it in your Downloads folder.', 'ok');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') setMsg('اتلغى الحفظ. دوس حفظ PDF وأكّد الحفظ.', 'warn');
    else if (code === 'rate_limited') setMsg('استنى ثانية وجرّب تاني.', 'warn');
    else setMsg('الحفظ فشل (' + (code || 'غير معروف') + '). جرّب تاني.', 'warn');
  } finally {
    $('saveBtn').disabled = false;
  }
}

async function printReport() {
  const v = values();
  const missing = [];
  if (!v.no) missing.push('رقم الملف');
  if (!v.name) missing.push('الاسم');
  if (!v.date) missing.push('التاريخ');
  if (!v.body) missing.push('نص التقرير');
  if (missing.length) { setMsg('ناقص: ' + missing.join('، ') + '.', 'warn'); return; }
  const safeNo = v.no.replace(/[^\p{L}\p{N}_-]/gu, '');
  if (!safeNo) { setMsg('رقم الملف غير صالح.', 'warn'); return; }
  $('printBtn').disabled = true;
  try {
    try { await printLayer.decode(); } catch (e) { /* already decoded */ }
    const off = document.createElement('canvas');
    const r = drawSheet(off, true);
    if (!r.fits) { setMsg('النص طويل جداً ومش هيدخل في المساحة المخصصة على الورقة.', 'warn'); return; }
    const downloads = await downloadsP;
    if (downloads) {
      // Inside Claude the browser print dialog is blocked, so save a print-ready A4 PDF instead.
      const pdf = await buildPdf(off);
      await downloads.save({ filename: (fileBase(v) || safeNo) + ' - print.pdf', data: pdf });
      setMsg('تم تجهيز نسخة الطباعة ' + (fileBase(v) || safeNo) + ' - print.pdf. افتحه واطبعه على ورق A4 بمقياس 100%.', 'ok');
    } else {
      const img = $('printImg');
      img.src = off.toDataURL('image/png');
      await img.decode();
      window.print();
      setMsg('اختار مقاس A4 ومقياس 100% وبدون Headers and footers في نافذة الطباعة.', 'ok');
    }
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') setMsg('اتلغى الحفظ.', 'warn');
    else setMsg('الطباعة فشلت (' + (code || 'غير معروف') + '). جرّب تاني.', 'warn');
  } finally {
    $('printBtn').disabled = false;
    ctx = canvas.getContext('2d');
  }
}

function today() {
  const d = new Date();
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}
function clearAll() {
  $('fileNo').value = ''; $('pname').value = ''; $('body').value = ''; $('recip').value = 'السادة/';
  $('pdate').value = today();
  setMsg('');
  refresh();
  $('fileNo').focus();
}

$('pdate').value = today();
for (const id of ['fileNo', 'pname', 'pdate', 'recip', 'body']) $(id).addEventListener('input', schedule);
$('form').addEventListener('submit', (e) => { e.preventDefault(); save(); });
$('clearBtn').addEventListener('click', clearAll);
$('printBtn').addEventListener('click', printReport);

// Sheet preview, then the save capability once the viewer answers.
const img = new Image();
img.onload = () => {
  letterhead = img;
  const go = () => refresh();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
};
img.src = LETTERHEAD;

if (window.claude && window.claude.use) {
  downloadsP = Promise.resolve(window.claude.use('downloads')).then((d) => d || null, () => null);
}
</script>
